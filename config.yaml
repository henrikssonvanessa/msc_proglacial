# Configuration for the MSc proglacial vegetation/geodiversity pipeline.
#
# Every script in this repository reads its tunable settings from this file
# instead of hardcoding them. To run the pipeline on a different machine or
# dataset, edit the values below (at minimum `paths.base_dir`) rather than
# touching the scripts themselves.
#
# Loaded via config_utils.load_config(). Override the file location with the
# PROGLACIAL_CONFIG environment variable if you keep multiple configs
# (e.g. one per collaborator or study).

paths:
  base_dir: "C:/TEMP/Vanessa_Henriksson/Proglacial_project"             # root working directory (scripts chdir here)
  outlines_shp: "Data/Study_areas/proglacial_outlines_new.shp"        # master study-area polygons
  glacier_shp: "Data/Study_areas/glacier_polygon.shp"             # glacier polygons (distance-from-glacier calc)
  lookup_table_gd: "Data/Study_areas/lookup_table_gd.csv"  # per-area sun azimuth/altitude (for hillshade)
  lookup_table_ortho: "Data/Study_areas/lookup_table.csv"  # per-area orthophoto source path (column: ortho); read by Proglacial_project.py
  training_gdb: "Data/gdb/training_data.gdb"
  external_test_gdb: "Data/gdb/external_test_data.gdb"
  outputs_1m: "Data/Outputs_1m"
  outputs_20m: "Data/Outputs_20m"
  # Single canonical predicted-vegetation folder: Veg_RF_polygon_cv.py writes its
  # final per-area raster here (and CV metrics CSVs) at the orthophoto's native
  # 0.4 m resolution — NOT resampled to 1 m, despite feeding both the 1 m and
  # 20 m pipelines — and every downstream script (terrain sampling,
  # geodiv_veg_all_areas.py, ndvi_validation.py) reads from here.
  predicted_vegetation_dir: "Data/Outputs_1m/Predicted_vegetation"
  # Flat folder with one DSM file per area, named "{area_name}_DSM_<year>.tif"
  # (year varies by area, e.g. 2024 for most, 2019 for Helags, 2022 for Stuorra)
  # — matched by "{area_name}_DSM" prefix in High_res_script.py's mosaic_dem(),
  # so the year suffix doesn't need to be listed here.
  dem_tiles_dir: "Data/DSM/Mosaics"
  snow_cover_dir: "Data/Snow_data"
  # Manually-generated (QGIS/SAGA) TRI and SWI rasters, one flat folder per resolution,
  # since these aren't computed by any script in this repo.
  tri_swi_1m_dir: "Data/DEM/TRI_SWI_1m"
  tri_swi_20m_dir: "Data/DEM/TRI_SWI_20m"
  glacier_polygon_scratch_gdb: "GIS/Proglacial_project.gdb/glacier_polygon_Select"  # scratch feature class for DistanceAccumulation
  arcgis_toolbox_data_management: "c:/program files/arcgis/pro/Resources/ArcToolbox/toolboxes/Data Management Tools.tbx"

random_state: 42          # shared seed for all RF models and random train/test splits
nodata_value: -9999        # sentinel used throughout for masked/NoData pixels

study_areas:
  # Row indices (0-based, as read by geopandas from paths.outlines_shp) excluded
  # from the current analysis (e.g. areas without complete input data).
  exclude_indices: [16]
  external_validation_areas: ["Suottas", "Vartas"]
  # Set to false to temporarily skip Veg_RF_polygon_cv.py's external validation
  # step against external_validation_areas (e.g. while training polygons or
  # study area extents are being reworked). Random split / polygon CV metrics
  # are unaffected.
  run_external_validation: false
  drone_only_area: "Karsa"   # area with dedicated drone-resolution data ('5mm' / '12cm' modes)
  # If non-empty, restrict every script to just these Glacier_na names (applied
  # after exclude_indices) — e.g. ["Suottas"] for a quick single-area test run.
  # Leave empty ([]) to process all areas as usual.
  only: []

# Which pre-computed Sentinel-2 snow-cover composite tile covers each area (Low_res_script.py)
snow_file_lookup:
  Suottas: "T33WXQ_snow_cover.tif"
  Vartas: "T33WXQ_snow_cover.tif"
  Mikka: "T33WXQ_snow_cover.tif"
  Ruotes: "T33WXQ_snow_cover.tif"
  Parte: "T33WXQ_snow_cover.tif"
  Karsa: "T33WXR_snow_cover.tif"
  Riuko: "T33WXR_snow_cover.tif"
  Gallan: "T33WXR_snow_cover.tif"
  Unna_Raita: "T33WXR_snow_cover.tif"
  Vaktpost: "T33WXR_snow_cover.tif"
  Storglaciaren: "T33WXR_snow_cover.tif"
  Isfall: "T33WXR_snow_cover.tif"
  Ballinriehppe_III: "T33WXR_snow_cover.tif"
  Rabots: "T33WXR_snow_cover.tif"
  Stuorra: "Stuorra_snow_cover.tif"
  Helags: "Helags_snow_cover.tif"

features:
  # Toggle optional predictor layers on/off. Set to false to skip a layer whose
  # source rasters aren't available yet (e.g. TRI/SWI not regenerated for a new
  # area, or snow cover not computed) so the rest of the pipeline can still be
  # smoke-tested end to end. Read by Sample_areas_1m.py (1 m sampling),
  # Sample_areas_20m.py (20 m sampling), RF_block_test.py, and
  # rf_vegetation_20m.py. Re-run sampling AND RF training together whenever you
  # change these — the sample shapefile's columns depend on which layers were
  # included at sampling time, so a stale shapefile sampled with different
  # toggles will not match. NOTE: geodiversity_index_HL.py/PCA.py and
  # Selection_ratio.py are not affected by these toggles — they read TRI/SWI
  # directly and need real rasters to run at all.
  use_tri: false
  use_swi: false
  use_snow: false    # 20 m only (Low_res_script.py / rf_vegetation_20m.py)

random_forest:
  vegetation_classifier:      # Veg_RF_polygon_cv.py — 4-band ortho pixel classifier
    n_estimators: 300
    max_depth: 20
    min_samples_leaf: 10
  terrain_classifier:         # RF_block_test.py / rf_vegetation_20m.py / Selection_ratio.py
    n_estimators: 100

cross_validation:
  polygon_cv_folds: 5          # Veg_RF_polygon_cv.py GroupKFold folds
  block_cv_folds: 5            # RF_block_test.py / rf_vegetation_20m.py GroupKFold folds
  block_size_1m: 200           # metres, spatial block size at 1 m resolution
  block_size_20m: 400          # metres, spatial block size at 20 m resolution
  random_split_test_size: 0.3

terrain_variables:
  geomorphon_search_radius_multiplier: 3   # search radius (m) = resolution_m * multiplier
  # Target resolution (m) the mosaicked DSM/DEM is resampled to (bilinear) before
  # any terrain variables are derived, in High_res_script.py's mosaic_dem(). The
  # rest of the 1 m pipeline (TRI/SWI, sampling, Low_res_script.py's own resample
  # to 20 m) assumes the result is at this resolution, regardless of the source
  # tiles' native resolution (e.g. 0.5 m DSM tiles). Set equal to the tiles'
  # native resolution to make the resample a no-op. The native-resolution mosaic
  # is kept as {area}_DEM_native.tif for reference / future re-analysis.
  dem_resample_target_m: 1

low_res:
  target_resolution: 20         # metres
  veg_fraction_threshold: 0.3   # min sub-pixel vegetation fraction to call a 20 m cell "vegetated"
  sample_fraction: 0.50         # fraction of the smaller class to sample
  sample_min_per_class: 50
  sample_max_per_class: 500

high_res_sampling:
  sample_fraction: 0.10         # fraction of the smaller class to sample
  sample_max_per_class: 2000
  min_sample_distance_m: 2

geodiversity:
  window_size: 10                # pixels, sliding-window size for landform diversity (H&L method)
  pca_feature_cols: ["Curvature", "Landforms", "TRI", "SWI"]
  # Filename patterns for the manually-generated TRI/SWI rasters (paths.tri_swi_1m_dir /
  # paths.tri_swi_20m_dir); {area} is replaced with the glacier name.
  tri_filename_1m: "{area}_TRI.tif"
  swi_filename_1m: "{area}_SWI.tif"
  tri_filename_20m: "TIF_TRI_{area}_DEM_clip.tif"
  swi_filename_20m: "TIF_SWI_{area}_DEM_fill.tif"

classification:
  # Geodiversity classes are assigned using global mean +/- sd_multipliers * std
  sd_multipliers: [1.5, 0.5]
  labels: ["Very low", "Low", "Medium", "High", "Very high"]

stats:
  sample_pixels_cap: 200000     # cap on pixels used for correlation tests (Spearman / point-biserial)

selection_ratio:
  resolution_mode: 20            # 1, 20, '5mm', or '12cm'
  n_bins: 10
  grid_resolution: 50
  pdp_y_padding: 0.02
  min_samples_reliable: 10
